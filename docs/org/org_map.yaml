# -----------------------------------------------------------------------------
# PROCESSES — accountable per transition + handoff. ids/routes/enums verbatim.
# -----------------------------------------------------------------------------
processes:

  # ===== domain: order-to-delivery =====
  - id: order_intake_daily
    name_he: קליטת הזמנות יומית
    domain: order_to_delivery
    accountable: doreen
    trigger: הזמנה נכנסת (Shopify/LionWheel אוטומטי; WhatsApp/טלפון ידני)
    system:
      external: [shopify, whatsapp, green_invoice]
      state_machine: wa_session
      skills: []
    transitions:
      - { step: הזמנה ידנית -> Shopify, accountable: doreen, handoff: auto-invoice (green_invoice) }
      - { step: bot cart committed, accountable: doreen, handoff: shopify order, note: "העוזרת הדיגיטלית של דורין; human_handled -> doreen" }
    deadline_he: "14:00 — סגירת הקו למחר"

  - id: order_prep_picking
    name_he: הכנת הזמנות וליקוט
    domain: order_to_delivery
    accountable: maxim            # was andrei (left); Tom brief 2026-07-21
    system:
      external: [lionwheel]
      state_machine: orders_mirror
      skills: []
    transitions:
      - { step: הכנת הזמנות לפי הזמנות פתוחות ב-LionWheel, accountable: maxim, handoff: משלוח מוכן }
      - { step: הזנת כמויות ליקוט ב-LionWheel, accountable: maxim, handoff: auto credit prep on gaps -> doreen }
      - { step: הדפסת חשבוניות למשלוח, accountable: maxim, handoff: מסמכים על המשטח }
    iron_rules_he: ["אזל = 0, לעולם לא להחליף (ירושה מהפלייבוק — לאשרר מול מקסים)"]

  - id: delivery_daily
    name_he: הפצה יומית
    domain: order_to_delivery
    accountable: maidan           # freelance driver (Tom 2026-07-21); playbook said maxim — STALE (F-3)
    system:
      external: [lionwheel]
      state_machine: orders_mirror   # ACTIVE fires FG_OUT ledger decrement (locked trigger)
      skills: [daily-delivery-dispatch, route-print-pack]
    transitions:
      - { step: מסירה מלאה -> "בוצע", accountable: maidan, handoff: none }
      - { step: סירוב מלא -> "בוטל", accountable: maidan, handoff: auto full credit -> doreen }
      - { step: מסירה חלקית -> ⊥ לסמן, accountable: maidan, handoff: doreen (phone, immediately) }
      - { step: לקוח לא זמין -> ⊥ לסמן, accountable: maidan, handoff: doreen decides defer|cancel }
    open_q_he: "מי מעמיס את הרכב — מקסים, מיידן, שניהם? (שאלון v2)"

  - id: credit_flow
    name_he: זרימת זיכויים
    domain: order_to_delivery
    accountable: doreen
    system:
      surfaces: [/credit-tracking]
      state_machine: credit_decisions
      external: [green_invoice, lionwheel]
      skills: []
    transitions:
      - { step: אישור והפקה (approve), accountable: doreen, handoff: GI credit -> customer }
      - { step: שליחה לטיפול ידני (acknowledge), accountable: doreen, handoff: doreen manual in green_invoice }
      - { step: דחייה (reject + סיבה), accountable: doreen, handoff: closed }

  - id: cancellations
    name_he: ביטולי הזמנות
    domain: order_to_delivery
    accountable: doreen
    system: { external: [shopify, lionwheel, green_invoice], skills: [] }
    transitions:
      - { step: "ביטול לפני 14:00", accountable: doreen, handoff: delete from shopify + invoice stop|manual credit }
      - { step: "ביטול אחרי 14:00 לפני יציאה", accountable: doreen, handoff: "LionWheel 'בוטל' -> auto full credit" }
      - { step: ביטול אחרי יציאת הנהג, accountable: doreen, handoff: notify maidan skip + same flow }

  - id: customer_complaint_postdelivery
    name_he: תלונת לקוח אחרי מסירה
    domain: order_to_delivery
    accountable: doreen
    system: { external: [green_invoice], skills: [], note: fully manual }
    transitions:
      - { step: אימות -> זיכוי ידני, accountable: doreen, handoff: stock re-intake if goods returned }

  - id: customer_service_collections
    name_he: שירות לקוחות וגבייה
    domain: order_to_delivery
    accountable: doreen
    system: { external: [whatsapp, green_invoice], skills: [] }
    transitions:
      - { step: קשר שוטף עם לקוחות על בעיות, accountable: doreen, handoff: tom on escalation }
      - { step: גבייה טלפונית מלקוחות חייבים, accountable: doreen, handoff: adi (תזרים) }
      - { step: מכירות ללקוחות חדשים, accountable: doreen, handoff: none }

  - id: leads_intake
    name_he: טיפול בלידים נכנסים
    domain: order_to_delivery
    accountable: doreen
    pain_he: "לא קורה מספיק טוב כרגע (Tom 2026-07-21) — F-2"
    system: { external: [whatsapp, shopify], skills: [] }
    transitions:
      - { step: ליד נכנס -> יצירת קשר, accountable: doreen, handoff: לקוח חדש | אבוד }

  # ===== domain: production (Denis) =====
  - id: production_execution
    name_he: ביצוע ייצור יומי
    domain: production
    accountable: denis
    system:
      surfaces: [/stock/production-actual]
      state_machine: form_submissions
      skills: [production-order]
    transitions:
      - { step: בישולי תה וערבובי כל המשקאות לפי מתכונים, accountable: denis, handoff: מילוי }
      - { step: מילוי + סגירה + תוויות + אריזה, accountable: denis, handoff: fg_intake_from_production -> maxim }
      - { step: הזנת דיווח ייצור יומי לפי ביצוע בפועל, accountable: denis, handoff: plan row derived-done }
    system_gap: F-1   # recipes->execution interface needs improvement (Tom)
    notes_he:
      - "שקילה תוך כדי בישול — דניס, בעמדת השקילה (טום Q4); צ'ק-ליסט הביצוע חייב לחיות שם, לא kitting מראש"
      - "QC Brix/pH: אין בדיקה שוטפת כיום — 'לא תקין' (טום Q3, F-4); יעד: דניס בסגירת פקודת ייצור"
      - "עיצוב מעגל פקודת-הייצור: DIRECTION_AGREED — ראה docs/org/PROPOSALS.md P-1; בנייה טרם אושרה"

  - id: rm_pkg_warehouse
    name_he: מחסן חומרי גלם ואריזות
    domain: production
    accountable: denis
    system: { surfaces: [/inventory], skills: [] }
    transitions:
      - { step: סידור וארגון המחסן, accountable: denis, handoff: none }
      - { step: קליטה פיזית של סחורה נכנסת, accountable: OPEN(OD-3), handoff: gr_entry }
      - { step: הקלדת קבלת סחורה (GR), accountable: OPEN(OD-3), handoff: PO rollup }

  - id: filling_room_hygiene
    name_he: חדר מילוי — סדר וניקיון מערכת
    domain: production
    accountable: denis
    system: { skills: [] }
    transitions:
      - { step: סידור חדר המילוי, accountable: denis, handoff: none }
      - { step: ניקיון שוטף של מערכת המילוי וכל הכלים, accountable: denis, handoff: none }

  # ===== domain: finished goods + logistics (Maxim) =====
  - id: fg_intake_from_production
    name_he: קליטת תוצרת מהייצור למחסן (דניס -> מקסים)
    domain: fg_logistics
    accountable: maxim
    seam: true                     # THE prototype seam
    system: { state_machine: form_submissions, skills: [] }
    transitions:
      - { step: דניס מעביר כמויות שיוצרו, accountable: denis, handoff: maxim }
      - { step: קליטה וסידור במחסן תוצרת, accountable: maxim, handoff: none }
    open_q_he: "איך ההעברה נרשמת? (דיווח הייצור של דניס אמור לכסות — לאמת בשאלון v2)"

  - id: fg_warehouse
    name_he: מחסן תוצרת מוגמרת
    domain: fg_logistics
    accountable: maxim
    system: { surfaces: [/inventory], skills: [] }
    transitions:
      - { step: סידור ושמירת סדר, accountable: maxim, handoff: none }
      - { step: ספירה שבועית של תוצרת מוגמרת, accountable: maxim, handoff: "OPEN(OD-2) — where is it recorded?" }

  # ===== domain: planning + procurement =====
  - id: weekly_planning_cadence
    name_he: קצב שבועי — חמישי לקבע, ראשון לרכוש, יומי לבצע
    domain: planning
    accountable: tom
    system:
      surfaces: [/planning/meeting, /planning/production-plan]
      state_machine: production_plan
      skills: [plan-production-14d]
    transitions:
      - { step: "חמישי: Firm W2 (draft->planned)", accountable: tom, handoff: sunday procurement }
      - { step: "ראשון: רכש ל-W1 + אימות הגעות W0", accountable: tom, handoff: procurement_weekly }
      - { step: "יומי: ביצוע W0", accountable: denis, handoff: production_execution }
    note_he: "יעד ארוך: התכנון יושב באנשים האחראים, לא באלכס (Tom 2026-07-21, OD-9)"

  - id: procurement_weekly
    name_he: סשן רכש שבועי
    domain: planning
    accountable: tom
    system:
      surfaces: [/planning/procurement]
      state_machine: purchase_session_lines
      skills: [procurement-planning]
    transitions:
      - { step: proposed -> approved, accountable: tom, handoff: po_placement (APPROVED_TO_ORDER) }
      - { step: proposed -> skipped, accountable: tom, handoff: next session }

  - id: po_placement
    name_he: ביצוע הזמנות רכש (תור דורין)
    domain: planning
    accountable: doreen
    system:
      surfaces: [/purchase-orders/placement-queue]
      state_machine: purchase_orders
      skills: []
    transitions:
      - { step: "APPROVED_TO_ORDER -> OPEN (מחיר+תנאים+בצע הזמנה)", accountable: doreen, handoff: supplier + goods_receipt }

  - id: goods_receipt
    name_he: קבלת סחורה
