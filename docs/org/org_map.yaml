# -----------------------------------------------------------------------------
open_decisions:  # owner=Tom for all. The redesign interview walks this list. (V8)
  - id: OD-1
    date: 2026-07-21
    q_he: "דורין — persona מנהלת-משרד על role=planner. להשאיר, או role ייעודי/viewer מחוזק?"
    context: viewer Hebrew cockpit designed for her persona sits unused; she needs planning:execute for placement-queue
    options: [keep planner (status quo, doc it), new office role (schema change — realignment tranche), viewer+capability carve]
  - id: OD-2
    date: 2026-07-21
    q_he: "מי עובד הייצור במערכת? לאנדריי/מקסים יש חשבונות פורטל? מי מדווח ייצור/ספירות/פחת?"
    context: production_operator persona unheld; Andrei+Maxim bound to LionWheel only
  - id: OD-3
    date: 2026-07-21
    q_he: "קבלת סחורה — מי מקבל פיזית ומי מקליד (GR)?"
    context: /stock/receipts English; goods-receipt-from-invoice skill runs via Tom today
  - id: OD-4
    date: 2026-07-21
    q_he: "חלוקת טיפול בחריגות (inbox) בין טום לדורין — לפי אילו קטגוריות?"
    context: playbook already splits alerts ad-hoc; inbox ownership never defined
  - id: OD-5
    date: 2026-07-21
    q_he: "החלוקה החדשה עצמה: גבולות גזרה מלאים לכל אדם — מה בבעלות מלאה, מה באישור, מה בידיעה בלבד"
    context: the core of the redesign; fills accountable on every OPEN + rewrites current bindings where Tom decides
  - id: OD-6
    date: 2026-07-21
    q_he: "אשרור פרוטוקול עדכון: קלוד מציע PR -> טום מאשר; drift check בכל PR + שבועי"
    context: default assumed after grill interrupt; needs explicit Tom yes
  - id: OD-7
    date: 2026-07-21
    q_he: "registries ריקים של gt-axis-* — להפנות למפה ולסגור, או להשאיר?"
    context: gt-axis-business declared owner of org knowledge but never fed; two sources risk
  - id: OD-8
    date: 2026-07-21
    q_he: "ערוץ הפצת הנהלים לצוות: הדפסה / WhatsApp / עמוד פורטל"
    context: derived Hebrew views (T5) need a delivery channel

decision_log: []   # resolved ODs move here with date + decision text; never deleted
